<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tudis - PDF, Imagens, QR Code e Tudo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --primary-light: #3b82f6;
      --secondary: #f97316;
      --success: #10b981;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f9fafb;
      color: var(--gray-900);
    }

    header {
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-image {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(37,99,235,0.2);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-name {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-tagline {
      font-size: 0.75rem;
      color: var(--gray-600);
      font-weight: 600;
    }

    .category-tabs {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tabs-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      gap: 0;
    }

    .tab {
      padding: 1rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--gray-600);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--primary);
      background: rgba(37,99,235,0.05);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .container h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .tool-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .tool-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(37,99,235,0.15);
      border-color: var(--primary-light);
    }

    .tool-icon {
      font-size: 2.5rem;
    }

    .tool-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .tool-description {
      font-size: 0.85rem;
      color: var(--gray-600);
      line-height: 1.4;
      flex-grow: 1;
    }

    .tool-badge {
      display: inline-block;
      background: #fbbf24;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      width: fit-content;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 2rem;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 2rem;
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.8rem;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 2rem;
    }

    .dropzone {
      border: 2px dashed var(--primary-light);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: rgba(37,99,235,0.05);
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1.5rem;
    }

    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--primary);
      background: rgba(37,99,235,0.1);
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .dropzone-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .dropzone-subtext {
      color: var(--gray-600);
      font-size: 0.95rem;
    }

    .dropzone-subtext strong {
      color: var(--primary);
    }

    input[type="file"] {
      display: none;
    }

    .file-preview {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin: 1rem 0;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      flex: 1;
      min-height: 44px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-900);
      border: 1px solid var(--gray-300);
    }

    .btn-secondary:hover {
      background: var(--gray-200);
    }

    .result-section {
      background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(34,197,94,0.1));
      border: 1px solid rgba(16,185,129,0.3);
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 1.5rem;
      display: none;
      text-align: center;
    }

    .result-section.show {
      display: block;
    }

    .result-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--success);
    }

    .download-btn {
      background: linear-gradient(135deg, var(--success), #34d399);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover {
      transform: scale(1.05);
    }

    .status-message {
      display: none;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      align-items: center;
      gap: 0.75rem;
      background: rgba(37,99,235,0.1);
      color: var(--primary);
    }

    .status-message.show {
      display: flex;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(37,99,235,0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-box {
      background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(249,115,22,0.1));
      border-left: 4px solid var(--primary);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1.5rem;
      color: var(--gray-700);
      font-size: 0.9rem;
    }

    .control-group {
      margin-bottom: 1rem;
    }

    .control-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .control-group input[type="range"],
    .control-group input[type="text"],
    .control-group input[type="number"],
    .control-group textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      font-family: monospace;
    }

    canvas {
      max-width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
    }

    #qr-display {
      text-align: center;
      margin: 2rem 0;
      display: none;
    }

    #qr-display.show {
      display: block;
    }

    @media (max-width: 768px) {
      .tools-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
      }
      .modal-content {
        width: 95%;
      }
    }

    footer {
      background: var(--gray-900);
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 4rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <img src="https://static.wixstatic.com/media/e97d0f_7b2e70b565f34b1aa03de70ad61d0b1f~mv2.png/v1/fill/w_474,h_598,al_c,lg_1,q_85,enc_avif,quality_auto/e97d0f_7b2e70b565f34b1aa03de70ad61d0b1f~mv2.png" alt="Tudis" class="logo-image">
      <div class="logo-text">
        <div class="logo-name">Tudis</div>
        <div class="logo-tagline">PDF, Imagens, QR Code e Tudo</div>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <div class="category-tabs">
    <div class="tabs-container" id="tabs-container">
      <button class="tab active" data-category="todas">Todas</button>
      <button class="tab" data-category="pdf">PDF</button>
      <button class="tab" data-category="imagem">Imagens</button>
      <button class="tab" data-category="qrcode">QR Code</button>
    </div>
  </div>

  <!-- Main -->
  <div class="container">
    <h1 id="category-title">Todas as ferramentas</h1>
    <div class="tools-grid" id="tools-grid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="tool-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>Tudis v6.16.0 • Desenvolvido por DSP Group adaptando para Tudis</p>
  </footer>

  <script>
    const { PDFDocument } = PDFLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const tools = [
      // PDF
      {id:'separar-pdf',icon:'✂️',name:'Separar PDF',desc:'Separa cada página em arquivo',category:'pdf'},
      {id:'juntar-pdf',icon:'📎',name:'Juntar PDF',desc:'Combina múltiplos PDFs',category:'pdf'},
      {id:'comprimir-pdf',icon:'🗜️',name:'Comprimir PDF',desc:'Reduz tamanho do PDF',category:'pdf'},
      {id:'dividir-pdf',icon:'📊',name:'Dividir PDF',desc:'Divide PDF por intervalo',category:'pdf'},
      {id:'rodar-pdf',icon:'🔄',name:'Rodar PDF',desc:'Rotaciona páginas',category:'pdf'},
      {id:'numerar-pdf',icon:'#️⃣',name:'Numerar Páginas',desc:'Adiciona números',category:'pdf'},
      {id:'marca-pdf',icon:'💧',name:'Marca d\'água',desc:'Adiciona marca ao PDF',category:'pdf'},
      {id:'proteger-pdf',icon:'🔐',name:'Proteger PDF',desc:'Adiciona senha',category:'pdf'},
      {id:'desbloquear-pdf',icon:'🔓',name:'Desbloquear PDF',desc:'Remove proteção',category:'pdf'},
      
      // Imagens
      {id:'comprimir-img',icon:'✅',name:'Comprimir Imagem',desc:'Reduz tamanho',category:'imagem'},
      {id:'redimensionar-img',icon:'📐',name:'Redimensionar',desc:'Ajusta dimensões',category:'imagem'},
      {id:'recortar-img',icon:'✂️',name:'Recortar Imagem',desc:'Recorta áreas',category:'imagem'},
      {id:'girar-img',icon:'🔄',name:'Girar Imagem',desc:'Rotaciona imagem',category:'imagem'},
      {id:'remover-bg',icon:'🎯',name:'Remover Fundo',desc:'Remove fundo branco',category:'imagem'},
      {id:'melhorar-img',icon:'⬆️',name:'Melhorar Imagem',desc:'Aumenta resolução',category:'imagem'},
      {id:'desfoque-img',icon:'👤',name:'Desfoque Facial',desc:'Desfoca rostos',category:'imagem'},
      {id:'marca-img',icon:'🎨',name:'Marcar Imagem',desc:'Adiciona marca d\'água',category:'imagem'},
      {id:'memes-img',icon:'😂',name:'Gerador de Memes',desc:'Cria memes',category:'imagem'},
      
      // QR Code
      {id:'qr-url',icon:'🌐',name:'QR Code URL',desc:'Gera QR de URL',category:'qrcode'},
      {id:'qr-texto',icon:'📝',name:'QR Code Texto',desc:'Gera QR de texto',category:'qrcode'},
      {id:'qr-wifi',icon:'📡',name:'QR Code WiFi',desc:'Gera QR de WiFi',category:'qrcode'},
    ];

    let rotationAngle = 0;

    function rotateImg(angle) {
      rotationAngle += angle;
      const preview = document.getElementById('prev-gir');
      if(preview) preview.style.transform = `rotate(${rotationAngle}deg)`;
    }

    function initializeUI() {
      renderTools('todas');
      setupTabs();
    }

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderTools(tab.dataset.category);
        });
      });
    }

    function renderTools(category) {
      const grid = document.getElementById('tools-grid');
      grid.innerHTML = '';

      const filtered = category === 'todas' ? tools : tools.filter(t => t.category === category);

      const categories = {'todas':'Todas','pdf':'Ferramentas PDF','imagem':'Edição de Imagens','qrcode':'QR Code'};
      document.getElementById('category-title').textContent = categories[category];

      filtered.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
          <div class="tool-icon">${tool.icon}</div>
          <div class="tool-name">${tool.name}</div>
          <div class="tool-description">${tool.desc}</div>
        `;
        card.addEventListener('click', () => openToolModal(tool));
        grid.appendChild(card);
      });
    }

    function openToolModal(tool) {
      document.getElementById('modal-title').textContent = tool.name;
      
      if(tool.id === 'separar-pdf') renderSepararPDF();
      else if(tool.id === 'juntar-pdf') renderJuntarPDF();
      else if(tool.id === 'comprimir-pdf') renderComprimirPDF();
      else if(tool.id === 'dividir-pdf') renderDividirPDF();
      else if(tool.id === 'rodar-pdf') renderRodarPDF();
      else if(tool.id === 'numerar-pdf') renderNumerarPDF();
      else if(tool.id === 'marca-pdf') renderMarcaPDF();
      else if(tool.id === 'proteger-pdf') renderProtegerPDF();
      else if(tool.id === 'desbloquear-pdf') renderDesbloquearPDF();
      else if(tool.id === 'comprimir-img') renderComprimirImg();
      else if(tool.id === 'redimensionar-img') renderRedimensionarImg();
      else if(tool.id === 'recortar-img') renderRecortarImg();
      else if(tool.id === 'girar-img') renderGirarImg();
      else if(tool.id === 'remover-bg') renderRemoverBG();
      else if(tool.id === 'melhorar-img') renderMelhorarImg();
      else if(tool.id === 'desfoque-img') renderDesfoque();
      else if(tool.id === 'marca-img') renderMarcaImg();
      else if(tool.id === 'memes-img') renderMemes();
      else if(tool.id === 'qr-url') renderQRURL();
      else if(tool.id === 'qr-texto') renderQRTexto();
      else if(tool.id === 'qr-wifi') renderQRWiFi();

      document.getElementById('tool-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('tool-modal').classList.remove('show');
    }

    // ====== FERRAMENTAS PDF ======
    
    function renderSepararPDF() {
      document.getElementById('modal-body').innerHTML = `
        <div class="dropzone" id="drop-sep">
          <div class="dropzone-icon">📤</div>
          <div class="dropzone-text">Arraste seu PDF</div>
          <div class="dropzone-subtext">ou <strong>clique para escolher</strong></div>
          <input type="file" id="inp-sep" accept="application/pdf">
        </div>
        <div id="info-sep" style="display:none;">
          <p id="meta-sep"></p>
        </div>
        <div class="button-group" id="btn-sep" style="display:none;">
          <button class="btn-secondary" onclick="resetSeparar()">Limpar</button>
          <button class="btn-primary" id="proc-sep">✂️ Separar</button>
        </div>
        <div class="result-section" id="res-sep">
          <div class="result-icon">✅</div>
          <div class="result-title">Sucesso!</div>
          <p id="res-txt-sep"></p>
          <a href="#" class="download-btn" id="down-sep" download="paginas.zip">⬇️ Baixar ZIP</a>
        </div>
      `;
      setupSepararPDF();
    }

    function setupSepararPDF() {
      const drop = document.getElementById('drop-sep');
      const inp = document.getElementById('inp-sep');
      const btn = document.getElementById('proc-sep');
      let file = null;

      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]);});
      inp.addEventListener('change', e => loadFile(e.target.files[0]));

      async function loadFile(f) {
        if(!f || f.type !== 'application/pdf') return alert('Selecione um PDF');
        file = f;
        drop.style.display = 'none';
        document.getElementById('info-sep').style.display = 'block';
        document.getElementById('btn-sep').style.display = 'flex';
        document.getElementById('meta-sep').textContent = `${f.name} • ${(f.size/1024/1024).toFixed(1)}MB`;
        
        const buf = await f.arrayBuffer();
        const pdf = await PDFDocument.load(buf, {ignoreEncryption: true});
        btn.disabled = false;
        btn.textContent = `✂️ Separar ${pdf.getPageCount()} página(s)`;
      }

      btn.addEventListener('click', async () => {
        if(!file) return;
        btn.disabled = true;
        const buf = await file.arrayBuffer();
        const pdf = await PDFDocument.load(buf, {ignoreEncryption: true});
        const zip = new JSZip();
        const count = pdf.getPageCount();

        for(let i = 0; i < count; i++) {
          const newPdf = await PDFDocument.create();
          const [page] = await newPdf.copyPages(pdf, [i]);
          newPdf.addPage(page);
          const bytes = await newPdf.save();
          zip.file(`pagina-${String(i+1).padStart(3,'0')}.pdf`, bytes);
        }

        const blob = await zip.generateAsync({type:'blob'});
        const url = URL.createObjectURL(blob);
        document.getElementById('down-sep').href = url;
        document.getElementById('res-txt-sep').textContent = `✅ ${count} página(s) separada(s)!`;
        document.getElementById('res-sep').classList.add('show');
        btn.disabled = false;
      });
    }

    function resetSeparar() {
      document.getElementById('drop-sep').style.display = 'block';
      document.getElementById('info-sep').style.display = 'none';
      document.getElementById('btn-sep').style.display = 'none';
      document.getElementById('res-sep').classList.remove('show');
      document.getElementById('inp-sep').value = '';
    }

    function renderJuntarPDF() {
      document.getElementById('modal-body').innerHTML = `
        <div class="dropzone" id="drop-jun">
          <div class="dropzone-icon">📎</div>
          <div class="dropzone-text">Arraste seus PDFs</div>
          <div class="dropzone-subtext">ou <strong>clique para escolher múltiplos</strong></div>
          <input type="file" id="inp-jun" accept="application/pdf" multiple>
        </div>
        <div id="info-jun" style="display:none;">
          <div id="list-jun"></div>
        </div>
        <div class="button-group" id="btn-jun" style="display:none;">
          <button class="btn-secondary" onclick="resetJuntar()">Limpar</button>
          <button class="btn-primary" id="proc-jun">📎 Juntar</button>
        </div>
        <div class="result-section" id="res-jun">
          <div class="result-icon">✅</div>
          <div class="result-title">Sucesso!</div>
          <p id="res-txt-jun"></p>
          <a href="#" class="download-btn" id="down-jun" download="arquivo-unido.pdf">⬇️ Baixar PDF</a>
        </div>
      `;
      setupJuntarPDF();
    }

    function setupJuntarPDF() {
      const drop = document.getElementById('drop-jun');
      const inp = document.getElementById('inp-jun');
      const btn = document.getElementById('proc-jun');
      let files = [];

      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadFiles(e.dataTransfer.files);});
      inp.addEventListener('change', e => loadFiles(e.target.files));

      function loadFiles(f) {
        files = Array.from(f).filter(x => x.type === 'application/pdf');
        if(!files.length) return alert('Selecione PDFs');
        drop.style.display = 'none';
        document.getElementById('info-jun').style.display = 'block';
        document.getElementById('btn-jun').style.display = 'flex';
        
        let html = '<strong>Arquivos:</strong><ul style="margin-top:0.5rem;">';
        files.forEach((f, i) => html += `<li>${i+1}. ${f.name}</li>`);
        html += '</ul>';
        document.getElementById('list-jun').innerHTML = html;
        btn.disabled = false;
      }

      btn.addEventListener('click', async () => {
        if(!files.length) return;
        btn.disabled = true;
        const merged = await PDFDocument.create();

        for(let f of files) {
          const buf = await f.arrayBuffer();
          const pdf = await PDFDocument.load(buf, {ignoreEncryption: true});
          const pages = await merged.copyPages(pdf, pdf.getPageIndices());
          pages.forEach(p => merged.addPage(p));
        }

        const bytes = await merged.save();
        const blob = new Blob([bytes], {type: 'application/pdf'});
        const url = URL.createObjectURL(blob);
        document.getElementById('down-jun').href = url;
        document.getElementById('res-txt-jun').textContent = `✅ ${files.length} PDF(s) juntado(s)!`;
        document.getElementById('res-jun').classList.add('show');
        btn.disabled = false;
      });
    }

      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});

            drop.style.display = 'none';

          };
          i.src = e.target.result;
        };
        r.readAsDataURL(f);
      }

      btn.addEventListener('click', () => {
        const rad = (rotationAngle * Math.PI) / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);
        const w = img.width;
        const h = img.height;
        const nw = Math.abs(w * cos) + Math.abs(h * sin);
        const nh = Math.abs(w * sin) + Math.abs(h * cos);
        const c = document.createElement('canvas');
        c.width = nw;

        const ctx = c.getContext('2d');
        ctx.translate(nw / 2, nh / 2);
        ctx.rotate(rad);
        ctx.drawImage(img, -w / 2, -h / 2);

          document.getElementById('down-gir').href = URL.createObjectURL(b);
          document.getElementById('res-gir').classList.add('show');
        }, 'image/jpeg', 0.9);

        <div class="control-group" id="ctrl-des" style="display:none;"><label>Intensidade</label><input type="range" id="int-des" min="3" max="30" value="15"><small id="int-val">15px</small></div>
        <div class="button-group" id="btn-des" style="display:none;"><button class="btn-secondary" onclick="resetDes()">Limpar</button><button class="btn-primary" id="proc-des">👤 Desfoque</button></div>
        <div class="result-section" id="res-des"><a href="#" class="download-btn" id="down-des" download="imagem.jpg">⬇️ Baixar</a></div>
      `;
      const drop = document.getElementById('drop-des');
      const inp = document.getElementById('inp-des');
      const btn = document.getElementById('proc-des');
      const int = document.getElementById('int-des');
      let img;

      int.addEventListener('input', e => document.getElementById('int-val').textContent = e.target.value + 'px');
      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadImg(e.dataTransfer.files[0]);});
      inp.addEventListener('change', e => loadImg(e.target.files[0]));

      function loadImg(f) {
        const r = new FileReader();
        r.onload = e => {
          const i = new Image();
          i.onload = () => {
            img = i;
            drop.style.display = 'none';
            document.getElementById('info-des').style.display = 'block';
            document.getElementById('ctrl-des').style.display = 'block';
            document.getElementById('btn-des').style.display = 'flex';
            document.getElementById('meta-des').textContent = `${f.name} • ${img.width}x${img.height}px`;
          };
          i.src = e.target.result;
        };
        r.readAsDataURL(f);
      }

      btn.addEventListener('click', () => {
        const can = document.getElementById('can-des');
        can.width = img.width;
        can.height = img.height;
        const ctx = can.getContext('2d');
        ctx.filter = `blur(${int.value}px)`;
        ctx.drawImage(img, 0, 0);
        can.style.display = 'block';
        can.toBlob(b => {
          document.getElementById('down-des').href = URL.createObjectURL(b);
          document.getElementById('res-des').classList.add('show');
        }, 'image/jpeg', 0.9);
      });
    }

    function resetDes() {
      document.getElementById('drop-des').style.display = 'block';
      document.getElementById('info-des').style.display = 'none';
      document.getElementById('ctrl-des').style.display = 'none';
      document.getElementById('btn-des').style.display = 'none';
      document.getElementById('res-des').classList.remove('show');
      document.getElementById('can-des').style.display = 'none';
    }

    function renderMarcaImg() {
      document.getElementById('modal-body').innerHTML = `
        <div class="dropzone" id="drop-mar"><div class="dropzone-icon">🎨</div><div class="dropzone-text">Arraste imagem</div><input type="file" id="inp-mar" accept="image/*"></div>
        <div id="info-mar" style="display:none;"><canvas id="can-mar" style="max-width:100%;border-radius:8px;display:none;"></canvas><p id="meta-mar"></p></div>
        <div id="ctrl-mar" style="display:none;"><div class="control-group"><label>Texto</label><input type="text" id="txt-mar" value="© Tudis"></div><div class="control-group"><label>Tamanho</label><input type="range" id="tam-mar" min="10" max="100" value="30"><small id="tam-val">30px</small></div><div class="control-group"><label>Opacidade</label><input type="range" id="opa-mar" min="0.1" max="1" step="0.1" value="0.7"><small id="opa-val">70%</small></div></div>
        <div class="button-group" id="btn-mar" style="display:none;"><button class="btn-secondary" onclick="resetMar()">Limpar</button><button class="btn-primary" id="proc-mar">🎨 Marcar</button></div>
        <div class="result-section" id="res-mar"><a href="#" class="download-btn" id="down-mar" download="imagem.jpg">⬇️ Baixar</a></div>
      `;
      const drop = document.getElementById('drop-mar');
      const inp = document.getElementById('inp-mar');
      const btn = document.getElementById('proc-mar');
      const tam = document.getElementById('tam-mar');
      const opa = document.getElementById('opa-mar');
      let img;

      tam.addEventListener('input', e => document.getElementById('tam-val').textContent = e.target.value + 'px');
      opa.addEventListener('input', e => document.getElementById('opa-val').textContent = Math.round(e.target.value * 100) + '%');
      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadImg(e.dataTransfer.files[0]);});
      inp.addEventListener('change', e => loadImg(e.target.files[0]));

      function loadImg(f) {
        const r = new FileReader();
        r.onload = e => {
          const i = new Image();
          i.onload = () => {
            img = i;
            drop.style.display = 'none';
            document.getElementById('info-mar').style.display = 'block';
            document.getElementById('ctrl-mar').style.display = 'block';
            document.getElementById('btn-mar').style.display = 'flex';
            document.getElementById('meta-mar').textContent = `${f.name} • ${img.width}x${img.height}px`;
          };
          i.src = e.target.result;
        };
        r.readAsDataURL(f);
      }

      btn.addEventListener('click', () => {
        const can = document.getElementById('can-mar');
        can.width = img.width;
        can.height = img.height;
        const ctx = can.getContext('2d');
        ctx.drawImage(img, 0, 0);
        ctx.font = `bold ${tam.value}px Arial`;
        ctx.fillStyle = `rgba(255,255,255,${opa.value})`;
        ctx.textAlign = 'center';
        ctx.fillText(document.getElementById('txt-mar').value, can.width / 2, can.height - 30);
        can.style.display = 'block';
        can.toBlob(b => {
          document.getElementById('down-mar').href = URL.createObjectURL(b);
          document.getElementById('res-mar').classList.add('show');
        }, 'image/jpeg', 0.9);
      });
    }

    function resetMar() {
      document.getElementById('drop-mar').style.display = 'block';
      document.getElementById('info-mar').style.display = 'none';
      document.getElementById('ctrl-mar').style.display = 'none';
      document.getElementById('btn-mar').style.display = 'none';
      document.getElementById('res-mar').classList.remove('show');
      document.getElementById('can-mar').style.display = 'none';
    }

    function renderMemes() {
      document.getElementById('modal-body').innerHTML = `
        <div class="dropzone" id="drop-mem"><div class="dropzone-icon">😂</div><div class="dropzone-text">Arraste imagem</div><input type="file" id="inp-mem" accept="image/*"></div>
        <div id="info-mem" style="display:none;"><canvas id="can-mem" style="max-width:100%;border-radius:8px;display:none;"></canvas><p id="meta-mem"></p></div>
        <div id="ctrl-mem" style="display:none;"><div class="control-group"><label>Texto Superior</label><input type="text" id="top-mem" placeholder="Texto"></div><div class="control-group"><label>Texto Inferior</label><input type="text" id="bot-mem" placeholder="Texto"></div></div>
        <div class="button-group" id="btn-mem" style="display:none;"><button class="btn-secondary" onclick="resetMem()">Limpar</button><button class="btn-primary" id="proc-mem">😂 Criar Meme</button></div>
        <div class="result-section" id="res-mem"><a href="#" class="download-btn" id="down-mem" download="meme.jpg">⬇️ Baixar</a></div>
      `;
      const drop = document.getElementById('drop-mem');
      const inp = document.getElementById('inp-mem');
      const btn = document.getElementById('proc-mem');
      let img;

      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadImg(e.dataTransfer.files[0]);});
      inp.addEventListener('change', e => loadImg(e.target.files[0]));

      function loadImg(f) {
        const r = new FileReader();
        r.onload = e => {
          const i = new Image();
          i.onload = () => {
            img = i;
            drop.style.display = 'none';
            document.getElementById('info-mem').style.display = 'block';
            document.getElementById('ctrl-mem').style.display = 'block';
            document.getElementById('btn-mem').style.display = 'flex';
            document.getElementById('meta-mem').textContent = `${f.name} • ${img.width}x${img.height}px`;
          };
          i.src = e.target.result;
        };
        r.readAsDataURL(f);
      }

      btn.addEventListener('click', () => {
        const can = document.getElementById('can-mem');
        can.width = img.width;
        can.height = img.height + 100;
        const ctx = can.getContext('2d');
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, can.width, 50);
        ctx.fillRect(0, can.height - 50, can.width, 50);
        ctx.drawImage(img, 0, 50);
        ctx.font = 'bold 30px Arial';
        ctx.fillStyle = 'white';
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 3;
        ctx.textAlign = 'center';
        const top = document.getElementById('top-mem').value.toUpperCase();
        const bot = document.getElementById('bot-mem').value.toUpperCase();
        ctx.strokeText(top, can.width / 2, 35);
        ctx.fillText(top, can.width / 2, 35);
        ctx.strokeText(bot, can.width / 2, can.height - 15);
        ctx.fillText(bot, can.width / 2, can.height - 15);
        can.style.display = 'block';
        can.toBlob(b => {
          document.getElementById('down-mem').href = URL.createObjectURL(b);
          document.getElementById('res-mem').classList.add('show');
        }, 'image/jpeg', 0.9);
      });
    }

    function resetMem() {
      document.getElementById('drop-mem').style.display = 'block';
      document.getElementById('info-mem').style.display = 'none';
      document.getElementById('ctrl-mem').style.display = 'none';
      document.getElementById('btn-mem').style.display = 'none';
      document.getElementById('res-mem').classList.remove('show');
      document.getElementById('can-mem').style.display = 'none';
    }

    // ====== QR CODE ======
    function renderQRURL() {
      document.getElementById('modal-body').innerHTML = `
        <div class="control-group">
          <label>Cole a URL:</label>
          <input type="text" id="qr-url-input" placeholder="https://exemplo.com">
        </div>
        <div class="button-group">
          <button class="btn-secondary" onclick="resetQR()">Limpar</button>
          <button class="btn-primary" onclick="generateQRURL()">🌐 Gerar QR Code</button>
        </div>
        <div id="qr-display"></div>
        <div class="result-section" id="qr-result">
          <a href="#" class="download-btn" id="qr-down" download="qrcode.png">⬇️ Baixar QR Code</a>
        </div>
      `;
    }

    function renderQRTexto() {
      document.getElementById('modal-body').innerHTML = `
        <div class="control-group">
          <label>Digite o texto:</label>
          <textarea id="qr-text-input" placeholder="Seu texto aqui..."></textarea>
        </div>
        <div class="button-group">
          <button class="btn-secondary" onclick="resetQR()">Limpar</button>
          <button class="btn-primary" onclick="generateQRText()">📝 Gerar QR Code</button>
        </div>
        <div id="qr-display"></div>
        <div class="result-section" id="qr-result">
          <a href="#" class="download-btn" id="qr-down" download="qrcode.png">⬇️ Baixar QR Code</a>
        </div>
      `;
    }

    function renderQRWiFi() {
      document.getElementById('modal-body').innerHTML = `
        <div class="control-group">
          <label>Nome da Rede (SSID):</label>
          <input type="text" id="qr-wifi-ssid" placeholder="Nome da rede">
        </div>
        <div class="control-group">
          <label>Senha:</label>
          <input type="password" id="qr-wifi-pwd" placeholder="Senha do WiFi">
        </div>
        <div class="button-group">
          <button class="btn-secondary" onclick="resetQR()">Limpar</button>
          <button class="btn-primary" onclick="generateQRWiFi()">📡 Gerar QR Code</button>
        </div>
        <div id="qr-display"></div>
        <div class="result-section" id="qr-result">
          <a href="#" class="download-btn" id="qr-down" download="qrcode.png">⬇️ Baixar QR Code</a>
        </div>
      `;
    }

    function generateQRURL() {
      const url = document.getElementById('qr-url-input').value;
      if(!url) return alert('Digite uma URL');
      generateQR(url);
    }

    function generateQRText() {
      const text = document.getElementById('qr-text-input').value;
      if(!text) return alert('Digite algo');
      generateQR(text);
    }

    function generateQRWiFi() {
      const ssid = document.getElementById('qr-wifi-ssid').value;
      const pwd = document.getElementById('qr-wifi-pwd').value;
      if(!ssid) return alert('Digite o nome da rede');
      const wifiString = `WIFI:T:WPA;S:${ssid};P:${pwd};;`;
      generateQR(wifiString);
    }

    function generateQR(text) {
      const display = document.getElementById('qr-display');
      display.innerHTML = '';
      display.classList.add('show');
      
      new QRCode(display, {
        text: text,
        width: 300,
        height: 300,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const canvas = display.querySelector('canvas');
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          document.getElementById('qr-down').href = url;
          document.getElementById('qr-result').classList.add('show');
        });
      }, 100);
    }

    function resetQR() {
      document.getElementById('qr-display').innerHTML = '';
      document.getElementById('qr-display').classList.remove('show');
      document.getElementById('qr-result').classList.remove('show');
      if(document.getElementById('qr-url-input')) document.getElementById('qr-url-input').value = '';
      if(document.getElementById('qr-text-input')) document.getElementById('qr-text-input').value = '';
      if(document.getElementById('qr-wifi-ssid')) {
        document.getElementById('qr-wifi-ssid').value = '';
        document.getElementById('qr-wifi-pwd').value = '';
      }
    }

    // Iniciar
    initializeUI();
    document.getElementById('tool-modal').addEventListener('click', e => {
      if(e.target.id === 'tool-modal') closeModal();
    });

    window.generateQRURL = generateQRURL;
    window.generateQRText = generateQRText;
    window.generateQRWiFi = generateQRWiFi;
    window.resetQR = resetQR;
    window.resetSeparar = resetSeparar;
    window.resetJuntar = resetJuntar;
    window.resetCompImg = resetCompImg;
    window.resetRedImg = resetRedImg;
    window.resetRecImg = resetRecImg;
    window.resetGirImg = resetGirImg;
    window.resetRbg = resetRbg;
    window.resetMeh = resetMeh;
    window.resetDes = resetDes;
    window.resetMar = resetMar;
    window.resetMem = resetMem;
  </script>
</body>
