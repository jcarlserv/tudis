<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --primary-light: #3b82f6;
      --secondary: #f97316;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f9fafb;
      color: var(--gray-900);
    }

    /* Header */
    header {
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-image {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-name {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-tagline {
      font-size: 0.75rem;
      color: var(--gray-600);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Category Tabs */
    .category-tabs {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 0;
      position: sticky;
      top: 70px;
      z-index: 40;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tabs-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      gap: 0;
    }

    .tab {
      padding: 1rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--gray-600);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .tab:hover {
      color: var(--primary);
      background: rgba(37, 99, 235, 0.05);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Main Content */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .container h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--gray-900);
    }

    .container-subtitle {
      color: var(--gray-600);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    /* Tools Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .tool-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .tool-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.15);
      border-color: var(--primary-light);
    }

    .tool-card.hidden {
      display: none;
    }

    .tool-icon {
      font-size: 2.5rem;
      line-height: 1;
    }

    .tool-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--gray-900);
    }

    .tool-description {
      font-size: 0.85rem;
      color: var(--gray-600);
      line-height: 1.4;
      flex-grow: 1;
    }

    .tool-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--warning), #fbbf24);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      width: fit-content;
      margin-top: 0.5rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 2rem;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      margin-bottom: 2rem;
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.8rem;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .close-btn:hover {
      transform: scale(1.2);
    }

    .modal-body {
      padding: 2rem;
    }

    /* Upload Area */
    .dropzone {
      border: 2px dashed var(--primary-light);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: rgba(37, 99, 235, 0.05);
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1.5rem;
    }

    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.1);
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .dropzone-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 0.5rem;
    }

    .dropzone-subtext {
      color: var(--gray-600);
      font-size: 0.95rem;
    }

    .dropzone-subtext strong {
      color: var(--primary);
    }

    input[type="file"] {
      display: none;
    }

    /* File Info */
    .file-info {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 1.5rem;
      display: none;
      margin-bottom: 1.5rem;
    }

    .file-info.show {
      display: block;
    }

    .file-info-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .file-icon {
      width: 50px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .file-details h3 {
      color: var(--gray-900);
      margin-bottom: 0.25rem;
    }

    .file-details p {
      color: var(--gray-600);
      font-size: 0.9rem;
      margin: 0.25rem 0;
    }

    /* Progress */
    .progress-container {
      margin: 1.5rem 0;
      display: none;
    }

    .progress-container.show {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--gray-200);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-text {
      text-align: center;
      color: var(--gray-600);
      font-size: 0.85rem;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      flex: 1;
      min-height: 44px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-900);
      border: 1px solid var(--gray-300);
    }

    .btn-secondary:hover {
      background: var(--gray-200);
    }

    /* Result */
    .result-section {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(34, 197, 94, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 1.5rem;
      display: none;
      text-align: center;
    }

    .result-section.show {
      display: block;
    }

    .result-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--success);
    }

    .result-description {
      color: var(--gray-600);
      margin-bottom: 1rem;
    }

    .download-btn {
      background: linear-gradient(135deg, var(--success), #34d399);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }

    /* Status */
    .status-message {
      display: none;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      align-items: center;
      gap: 0.75rem;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
    }

    .status-message.show {
      display: flex;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(37, 99, 235, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Info Box */
    .info-box {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(249, 115, 22, 0.1));
      border-left: 4px solid var(--primary);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1.5rem;
      color: var(--gray-700);
      font-size: 0.9rem;
    }

    .info-box strong {
      color: var(--gray-900);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .tools-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
      }

      .modal-content {
        width: 95%;
      }

      .container {
        padding: 2rem 1rem;
      }

      .tab {
        padding: 0.75rem 1rem;
        font-size: 0.85rem;
      }

      .header-content {
        padding: 0.75rem 1rem;
      }

      .logo-name {
        font-size: 1.2rem;
      }
    }

    /* Footer */
    footer {
      background: var(--gray-900);
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 4rem;
      font-size: 0.9rem;
    }

    .no-results {
      text-align: center;
      color: var(--gray-600);
      padding: 3rem;
    }
  </style>
</head>

        category: 'ia',
        implemented: false,
        badge: 'Novo'
      },
      {
        id: 'traduzir-pdf',
        icon: '🌍',
        name: 'Traduzir PDF',
        description: 'Traduza PDFs para outros idiomas',
        category: 'ia',
        implemented: false,
        badge: 'Novo'
      }
    ];

    // Inicializar UI
    function initializeUI() {
      renderTools('todas');
      setupTabs();
    }

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const category = tab.dataset.category;
          renderTools(category);
        });
      });
    }

    function renderTools(category) {
      const grid = document.getElementById('tools-grid');
      const noResults = document.getElementById('no-results');
      const categoryTitle = document.getElementById('category-title');

      grid.innerHTML = '';

      const filtered = category === 'todas' 
        ? tools 
        : tools.filter(tool => tool.category === category);

      if (filtered.length === 0) {
        noResults.style.display = 'block';
        categoryTitle.textContent = 'Nenhuma ferramenta encontrada';
        return;
      }

      noResults.style.display = 'none';
      const categoryNames = {
        'todas': 'Todas as ferramentas',
        'organizar': 'Organizar PDF',
        'converter': 'Converter PDF',
        'editar': 'Editar PDF',
        'otimizar': 'Otimizar PDF',
        'seguranca': 'Segurança de PDF',
        'ia': 'PDF Intelligence'
      };
      categoryTitle.textContent = categoryNames[category];

      filtered.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
          <div class="tool-icon">${tool.icon}</div>
          <div class="tool-name">${tool.name}</div>
          <div class="tool-description">${tool.description}</div>
          ${tool.badge ? `<div class="tool-badge">${tool.badge}</div>` : ''}
        `;
        card.addEventListener('click', () => openToolModal(tool));
        grid.appendChild(card);
      });
    }

    function openToolModal(tool) {
      document.getElementById('modal-title').textContent = tool.name;
      
      if (!tool.implemented) {
        document.getElementById('modal-body').innerHTML = `
          <p style="color: var(--gray-600); text-align: center; padding: 2rem 0;">
            <strong>🔄 Ferramenta em desenvolvimento</strong><br><br>
            Esta ferramenta será disponibilizada em breve. Volte sempre para atualizações!
          </p>
        `;
      } else if (tool.id === 'separar-pdf') {
        renderSepararPDFTool();
      }

      document.getElementById('tool-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('tool-modal').classList.remove('show');
    }

    function renderSepararPDFTool() {
      const html = `
        <div class="dropzone" id="dropzone-separar">
          <div class="dropzone-icon">📤</div>
          <div class="dropzone-text">Arraste seu PDF aqui</div>
          <div class="dropzone-subtext">ou <strong>clique para escolher</strong> um arquivo</div>
          <input type="file" id="file-input-separar" accept="application/pdf">
        </div>

        <div class="file-info" id="file-info-separar">
          <div class="file-info-header">
            <div class="file-icon">PDF</div>
            <div class="file-details">
              <h3 id="file-name-separar"></h3>
              <p id="file-size-separar"></p>
              <p id="page-count-separar" style="color: var(--primary); font-weight: 600;"></p>
            </div>
          </div>
        </div>

        <div class="status-message" id="status-separar">
          <div class="spinner"></div>
          <span id="status-text-separar">Processando seu arquivo...</span>
        </div>

        <div class="progress-container" id="progress-separar">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill-separar"></div>
          </div>
          <div class="progress-text">
            <span id="progress-text-separar">Processando...</span>
          </div>
        </div>

        <div class="button-group" id="button-group-separar" style="display: none;">
          <button class="btn-secondary" id="clear-btn-separar">Limpar</button>
          <button class="btn-primary" id="process-btn-separar" disabled>
            <span>⚡</span> Separar Páginas
          </button>
        </div>

        <div class="result-section" id="result-separar">
          <div class="result-icon">✅</div>
          <div class="result-title">Sucesso!</div>
          <div class="result-description" id="result-text-separar"></div>
          <a href="#" class="download-btn" id="download-btn-separar" download="paginas.zip">
            <span>⬇️</span> Baixar ZIP
          </a>
        </div>

        <div class="info-box">
          <strong>ℹ️ Como funciona:</strong> Seu PDF será separado em múltiplos arquivos (um por página) e baixados como um arquivo ZIP. Tudo é processado localmente no seu navegador, sem envio de dados para nenhum servidor.
        </div>
      `;

      document.getElementById('modal-body').innerHTML = html;
      setupSepararPDFHandlers();
    }

    function setupSepararPDFHandlers() {
      const dropzoneSeparar = document.getElementById('dropzone-separar');
      const fileInputSeparar = document.getElementById('file-input-separar');
      const fileInfoSeparar = document.getElementById('file-info-separar');
      const buttonGroupSeparar = document.getElementById('button-group-separar');
      const processBtnSeparar = document.getElementById('process-btn-separar');
      const clearBtnSeparar = document.getElementById('clear-btn-separar');
      const progressSeparar = document.getElementById('progress-separar');
      const statusSeparar = document.getElementById('status-separar');
      const resultSeparar = document.getElementById('result-separar');
      const downloadBtnSeparar = document.getElementById('download-btn-separar');

      let currentFileSeparar = null;
      let pageCountSeparar = 0;

      function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes, k));
        return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
      }

      dropzoneSeparar.addEventListener('click', () => fileInputSeparar.click());

      dropzoneSeparar.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzoneSeparar.classList.add('drag-over');
      });

      dropzoneSeparar.addEventListener('dragleave', () => {
        dropzoneSeparar.classList.remove('drag-over');
      });

      dropzoneSeparar.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzoneSeparar.classList.remove('drag-over');
        if (e.dataTransfer.files.length) {
          handleFileSelectSeparar(e.dataTransfer.files[0]);
        }
      });

      fileInputSeparar.addEventListener('change', (e) => {
        if (e.target.files.length) {
          handleFileSelectSeparar(e.target.files[0]);
        }
      });

      async function handleFileSelectSeparar(file) {
        if (file.type !== 'application/pdf') {
          alert('Por favor, selecione um arquivo PDF');
          return;
        }

        currentFileSeparar = file;
        dropzoneSeparar.style.display = 'none';
        fileInfoSeparar.classList.add('show');
        buttonGroupSeparar.style.display = 'flex';

        document.getElementById('file-name-separar').textContent = file.name;
        document.getElementById('file-size-separar').textContent = formatFileSize(file.size);
        document.getElementById('page-count-separar').textContent = 'Carregando...';

        try {
          const buf = await file.arrayBuffer();
          const pdf = await PDFDocument.load(buf, { ignoreEncryption: true });
          pageCountSeparar = pdf.getPageCount();
          document.getElementById('page-count-separar').textContent = `${pageCountSeparar} página${pageCountSeparar !== 1 ? 's' : ''}`;
          processBtnSeparar.disabled = false;
        } catch (error) {
          alert('Erro ao carregar o PDF: ' + error.message);
          resetSeparar();
        }
      }

      function resetSeparar() {
        currentFileSeparar = null;
        pageCountSeparar = 0;
        dropzoneSeparar.style.display = 'block';
        fileInfoSeparar.classList.remove('show');
        buttonGroupSeparar.style.display = 'none';
        fileInputSeparar.value = '';
        resultSeparar.classList.remove('show');
        progressSeparar.classList.remove('show');
        statusSeparar.classList.remove('show');
        processBtnSeparar.disabled = true;
      }

      clearBtnSeparar.addEventListener('click', resetSeparar);

      processBtnSeparar.addEventListener('click', async () => {
        if (!currentFileSeparar) return;

        statusSeparar.classList.add('show');
        progressSeparar.classList.add('show');
        resultSeparar.classList.remove('show');
        processBtnSeparar.disabled = true;
        clearBtnSeparar.disabled = true;

        try {
          const buf = await currentFileSeparar.arrayBuffer();
          const sourcePdf = await PDFDocument.load(buf, { ignoreEncryption: true });
          const zip = new JSZip();

          for (let i = 0; i < pageCountSeparar; i++) {
            const newPdf = await PDFDocument.create();
            const [copiedPage] = await newPdf.copyPages(sourcePdf, [i]);
            newPdf.addPage(copiedPage);

            const pdfBytes = await newPdf.save();
            const fileName = `pagina-${String(i + 1).padStart(3, '0')}.pdf`;
            zip.file(fileName, pdfBytes);

            const progress = Math.round(((i + 1) / pageCountSeparar) * 100);
            document.getElementById('progress-fill-separar').style.width = progress + '%';
            document.getElementById('progress-text-separar').textContent = `Processando página ${i + 1} de ${pageCountSeparar}...`;
          }

          const zipBlob = await zip.generateAsync({ type: 'blob' });
          const zipUrl = URL.createObjectURL(zipBlob);

          downloadBtnSeparar.href = zipUrl;
          downloadBtnSeparar.download = `pdf-separadas-${Date.now()}.zip`;

          document.getElementById('result-text-separar').textContent = 
            `✅ Perfeito! Suas ${pageCountSeparar} página(s) foram separadas em arquivos individuais.`;
          
          statusSeparar.classList.remove('show');
          progressSeparar.classList.remove('show');
          resultSeparar.classList.add('show');
        } catch (error) {
          console.error(error);
          statusSeparar.classList.remove('show');
          progressSeparar.classList.remove('show');
          alert('Erro ao processar PDF: ' + error.message);
        } finally {
          processBtnSeparar.disabled = false;
          clearBtnSeparar.disabled = false;
        }
      });
    }

    // Fechar modal ao clicar fora
    document.getElementById('tool-modal').addEventListener('click', (e) => {
      if (e.target.id === 'tool-modal') {
        closeModal();
      }
    });

    // Inicializar
    initializeUI();
  </script>
</body>
</html>
